<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fornecedores — MCMT</title>
  <link rel="icon" href="../img/servicos.png" />
  <link rel="stylesheet" href="database/MCMT.css" />
  <link rel="stylesheet" href="fornecedores/fornecedores.css" />
</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="durtocGateKeeper.js"></script>

  <div class="aurebesh-bg" aria-hidden="true"></div>
  <script src="../js/mcmt-shell.js" data-active="fornecedores"></script>

  <main class="mcmt-wrapper">

    <section class="mcmt-hero">
      <p class="hero-eyebrow"><span>fornecedores</span>Rede de Suprimentos · Peças e Componentes</p>
      <h1>Terminal de Fornecedores</h1>
      <p class="hero-sub">Consulte contatos, origem e qualidade dos fornecedores de peças da oficina.</p>
      <div class="hero-meta">
        <span class="reg-num">SUP-MCMT</span>
        Catálogo de fornecedores
      </div>
    </section>

    <div class="section-header">
      <span class="section-tag">busca</span>
      <h2>Filtros</h2>
    </div>

    <div class="filtros-container">
      <div class="filtro-grupo">
        <label for="busca-nome">Nome do fornecedor</label>
        <input type="text" id="busca-nome" class="filtro-input" placeholder="Ex: Faísca...">
      </div>
      <div class="filtro-grupo">
        <label for="busca-raca">Raça</label>
        <input type="text" id="busca-raca" class="filtro-input" placeholder="Ex: Twi'lek...">
      </div>
      <div class="filtro-grupo">
        <label for="busca-planeta">Planeta</label>
        <input type="text" id="busca-planeta" class="filtro-input" placeholder="Ex: Coruscant...">
      </div>
      <div class="filtro-grupo">
        <label for="filtro-qualidade">Qualidade</label>
        <select id="filtro-qualidade" class="filtro-input">
          <option value="">Todas</option>
          <option value="Ruim">Ruim</option>
          <option value="Normal">Normal</option>
          <option value="Boa">Boa</option>
          <option value="Excelente">Excelente</option>
        </select>
      </div>
    </div>

    <div class="section-header">
      <span class="section-tag">registro</span>
      <h2>Fornecedores Registrados</h2>
    </div>

    <div id="lista-fornecedores"></div>
    <p id="mensagem-nenhum-resultado" style="display: none;">Nenhum fornecedor corresponde aos parâmetros de busca.</p>

  </main>

  <script src="fornecedores/fornecedores.js"></script>
</body>

</html>
