<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tripulantes — MCMT</title>
  <link rel="icon" href="../img/servicos.png" />
  <link rel="stylesheet" href="database/MCMT.css" />
  <link rel="stylesheet" href="tripulantes/tripulantes.css" />
</head>

<body>

  <div class="aurebesh-bg" aria-hidden="true"></div>
  <script src="../js/mcmt-shell.js" data-active="tripulantes"></script>

  <main class="mcmt-wrapper">

    <!-- Hero -->
    <section class="mcmt-hero">
      <p class="hero-eyebrow"><span>tripulacao</span>Registro de Pessoal — Brigada das Catracas</p>
      <h1>Tripulação</h1>
      <p class="hero-sub">
        Arquivos da equipe da Engrenagem Mestra: a função que cada um exercia a bordo
        e o cargo que ocupa hoje nas oficinas MCMT.
      </p>
      <div class="hero-meta">
        <span class="reg-num">CRW-MCMT</span>
        TRIPULANTES REGISTRADOS: <span id="crew-count">—</span>
      </div>
    </section>

    <div class="section-header">
      <span class="section-tag">registros</span>
      <h2>Tripulantes Registrados</h2>
    </div>

    <!-- Os cards são gerados por tripulantes/tripulantes.js a partir de tripulantes/tripulantes.json -->
    <div class="cards-grid crew-grid" id="crew-grid" aria-live="polite">
      <p class="crew-status">Carregando arquivos…</p>
    </div>
    <noscript>
      <p class="crew-status">Ative o JavaScript para consultar os registros da tripulação.</p>
    </noscript>

  </main>

  <!-- Modal de ficha -->
  <div class="mcmt-modal-overlay" id="crew-overlay" role="dialog" aria-modal="true" aria-labelledby="crew-title">
    <div class="mcmt-modal crew-modal">
      <div class="modal-close">
        <button type="button" id="crew-close" aria-label="Fechar">&#x2715; FECHAR</button>
      </div>
      <div class="modal-inner">
        <div class="modal-img-col">
          <div class="crew-photos" id="crew-photos"></div>
        </div>
        <div class="modal-content-col">
          <p class="modal-eyebrow" id="crew-eyebrow"></p>
          <h2 class="modal-title" id="crew-title"></h2>
          <p class="modal-subtitle" id="crew-subtitle"></p>
          <div id="crew-body"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="tripulantes/tripulantes.js"></script>
</body>

</html>
