<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Tático da Resistência</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/frotaRebeldes.css">
    <link rel="icon" type="image/x-icon" href="../img/rebelde.png">
</head>

<body class="min-h-screen flex flex-col p-4 md:p-8">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>

    <header class="mb-8 text-center relative flex flex-col items-center">
        <a href="../"
            class="absolute top-0 left-0 flex items-center gap-1 py-1 px-3 rounded-md font-bold text-[#4da8da] border border-[#4da8da] bg-[#0a1526]/70 hover:bg-[#4da8da]/20 transition-colors shadow-md text-xs uppercase tracking-widest"
            style="text-decoration:none;">
            <span class="text-lg">&#8592;</span> Voltar
        </a>

        <h1 class="text-3xl md:text-5xl font-bold uppercase tracking-widest text-[#4da8da] hologram-text">
            Comando de Frota
        </h1>
        <p id="player-faction-display"
            class="text-xs md:text-sm opacity-80 mt-2 tracking-widest text-yellow-400 font-bold">CARREGANDO
            IDENTIFICAÇÃO DE SETOR...</p>

        <button onclick="carregarFrotaRebelde()"
            class="mt-4 bg-transparent border border-[#4da8da] text-[#4da8da] hover:bg-[#4da8da] hover:text-black py-2 px-6 rounded text-xs font-bold uppercase tracking-widest transition-all shadow-[0_0_10px_rgba(77,168,218,0.3)]">
            Sincronizar Sensores (Atualizar)
        </button>

        <div class="absolute w-full h-[1px] bg-[#4da8da] mt-24 opacity-50 shadow-[0_0_10px_#4da8da]"></div>
    </header>

    <main class="max-w-7xl w-full mx-auto flex-grow mt-6">
        <div id="alertBox"
            class="mb-6 text-xs p-3 border hidden uppercase tracking-wider text-center transition-all duration-300">
        </div>

        <section class="w-full">
            <div
                class="panel-header text-lg p-2 mb-6 uppercase font-bold flex justify-between items-center bg-gradient-to-r from-[#4da8da]/20 to-transparent border-b border-[#4da8da] text-[#4da8da]">
                <span>> Monitor de Combate</span>
                <span id="combat-alert" class="text-xs text-stone-500 font-normal">AGUARDANDO DADOS TÁTICOS</span>
            </div>

            <div id="fleetGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Naves injetadas via JS -->
            </div>
        </section>
    </main>

    <script src="../js/frotaRebeldes.js"></script>
</body>

</html>
